name: Social Queue Poster

on:
  schedule:
    # Every 5 min -- was hourly, which meant a queued post could sit up to
    # 59 minutes before going out. publish-articles.yml also dispatches this
    # workflow directly right after queuing, so this cron is mainly a
    # backstop/catch-all (and the only trigger for recurring-countdown posts).
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install @atproto/api
      - run: node scripts/post-to-bluesky.js
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      - name: Commit updated queue
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add social-queue.json
          git diff --staged --quiet || git commit -m "Mark posted items in social queue"
          git push
